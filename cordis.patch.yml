# dsh-session-manager 会话管理插件
# 会话管理插件（由原 rewind 与 archive 两个功能合并而来）。
#
# host 半边：
# - rewind：会话回退条目扫描 + /api/session-manager/rewind/*
# - archives：/api/session-manager/archives/*
# client 半边：
# - 会话头部“回退”按钮
# - 侧边栏底部“归档会话”入口
- insert:
    - id: session-manager
      name: '@the-heart-fickle/dsh-session-manager'
